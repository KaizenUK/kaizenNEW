name: Deploy to Kaizen

on:
  push:
    branches:
      - main
      - stage
  repository_dispatch:
    types:
      - sanity-update
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  static-deploy:
    name: Build and Deploy Static Sites
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install and Build (CI Check)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build
          pnpm --dir apps/studio install --frozen-lockfile
          pnpm --dir apps/studio run build

      - name: Deploy Production Public Static on VPS
        if: github.ref == 'refs/heads/main' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'main' || github.event.client_payload.target == 'prod' || github.event.client_payload.target == 'production' || github.event.client_payload.target == ''))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR_PROD }}"
            PUBLIC_WEB_ROOT="${{ secrets.VPS_WEB_ROOT_PROD }}"
            REDIRECTS_INCLUDE_PATH="${{ secrets.VPS_NGINX_REDIRECTS_INCLUDE_PROD || '' }}"
            PUBLIC_DOMAIN="${{ secrets.VPS_PUBLIC_DOMAIN_PROD || 'kaizenweb.co.uk' }}"

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            corepack enable
            corepack pnpm install --frozen-lockfile
            rm -rf dist .astro
            corepack pnpm run build

            mkdir -p "$PUBLIC_WEB_ROOT"
            rsync -a --delete dist/ "$PUBLIC_WEB_ROOT/"

            if [ -n "$REDIRECTS_INCLUDE_PATH" ]; then
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                SUDO=""
              fi

              $SUDO install -m 0644 dist/redirects.generated.conf "$REDIRECTS_INCLUDE_PATH"
              $SUDO nginx -t
              if command -v systemctl >/dev/null 2>&1; then
                $SUDO systemctl reload nginx
              else
                $SUDO service nginx reload
              fi
            fi

            curl -fsS -H "Host: $PUBLIC_DOMAIN" http://127.0.0.1/ >/dev/null

      - name: Deploy Staging Public Static on VPS
        if: github.ref == 'refs/heads/stage' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'stage' || github.event.client_payload.target == 'staging'))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR_STAGE }}"
            PUBLIC_WEB_ROOT="${{ secrets.VPS_WEB_ROOT_STAGE }}"
            REDIRECTS_INCLUDE_PATH="${{ secrets.VPS_NGINX_REDIRECTS_INCLUDE_STAGE || '' }}"
            PUBLIC_DOMAIN="${{ secrets.VPS_PUBLIC_DOMAIN_STAGE || 'stage.kaizenweb.co.uk' }}"

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin stage
            git reset --hard origin/stage

            corepack enable
            corepack pnpm install --frozen-lockfile
            rm -rf dist .astro
            corepack pnpm run build

            mkdir -p "$PUBLIC_WEB_ROOT"
            rsync -a --delete dist/ "$PUBLIC_WEB_ROOT/"

            if [ -n "$REDIRECTS_INCLUDE_PATH" ]; then
              if command -v sudo >/dev/null 2>&1; then
                SUDO="sudo"
              else
                SUDO=""
              fi

              $SUDO install -m 0644 dist/redirects.generated.conf "$REDIRECTS_INCLUDE_PATH"
              $SUDO nginx -t
              if command -v systemctl >/dev/null 2>&1; then
                $SUDO systemctl reload nginx
              else
                $SUDO service nginx reload
              fi
            fi

            curl -fsS -H "Host: $PUBLIC_DOMAIN" http://127.0.0.1/ >/dev/null

      - name: Deploy Production Studio Static on VPS
        if: github.ref == 'refs/heads/main' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'main' || github.event.client_payload.target == 'prod' || github.event.client_payload.target == 'production' || github.event.client_payload.target == ''))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR_PROD }}"
            STUDIO_WEB_ROOT="${{ secrets.VPS_STUDIO_WEB_ROOT_PROD }}"
            STUDIO_DOMAIN="${{ secrets.VPS_STUDIO_DOMAIN_PROD || 'studio.kaizenweb.co.uk' }}"

            if [ -z "$STUDIO_WEB_ROOT" ]; then
              echo "VPS_STUDIO_WEB_ROOT_PROD is empty. Skipping studio deploy."
              exit 0
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main
            git reset --hard origin/main

            corepack enable
            corepack pnpm --dir apps/studio install --frozen-lockfile
            rm -rf apps/studio/dist
            corepack pnpm --dir apps/studio run build

            mkdir -p "$STUDIO_WEB_ROOT/studio"
            rsync -a --delete apps/studio/dist/ "$STUDIO_WEB_ROOT/studio/"

            curl -fsS -H "Host: $STUDIO_DOMAIN" http://127.0.0.1/studio/ >/dev/null

      - name: Deploy Staging Studio Static on VPS
        if: github.ref == 'refs/heads/stage' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'stage' || github.event.client_payload.target == 'staging'))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail

            APP_DIR="${{ secrets.VPS_APP_DIR_STAGE }}"
            STUDIO_WEB_ROOT="${{ secrets.VPS_STUDIO_WEB_ROOT_STAGE }}"
            STUDIO_DOMAIN="${{ secrets.VPS_STUDIO_DOMAIN_STAGE || 'studio-stage.kaizenweb.co.uk' }}"

            if [ -z "$STUDIO_WEB_ROOT" ]; then
              echo "VPS_STUDIO_WEB_ROOT_STAGE is empty. Skipping studio deploy."
              exit 0
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin stage
            git reset --hard origin/stage

            corepack enable
            corepack pnpm --dir apps/studio install --frozen-lockfile
            rm -rf apps/studio/dist
            corepack pnpm --dir apps/studio run build

            mkdir -p "$STUDIO_WEB_ROOT/studio"
            rsync -a --delete apps/studio/dist/ "$STUDIO_WEB_ROOT/studio/"

            curl -fsS -H "Host: $STUDIO_DOMAIN" http://127.0.0.1/studio/ >/dev/null

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Static deploy to ${{ github.ref_name }}"
