name: Deploy to Kaizen

on:
  push:
    branches:
      - main
      - stage
  repository_dispatch:
    types:
      - sanity-update
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: false

jobs:
  web-deploy:
    name: Build and Deploy SSR
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144 # High limit for the GitHub runner
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Enable Corepack
        run: corepack enable

      - name: Install and Build (CI Check)
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      # --- PRODUCTION DEPLOY ---
      - name: Deploy Production SSR on VPS
        if: github.ref == 'refs/heads/main' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'main' || github.event.client_payload.target == 'prod' || github.event.client_payload.target == 'production' || github.event.client_payload.target == ''))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR_PROD }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_PROD }}"
            export PORT="${{ secrets.VPS_PORT_PROD || '4321' }}"
            export NODE_OPTIONS="--max-old-space-size=3072" 

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"

            # Sync to the "New Reality"
            git fetch origin main
            git reset --hard origin/main

            # Build phase
            corepack enable
            corepack pnpm install --frozen-lockfile
            rm -rf dist .astro
            corepack pnpm run build

            # Zero-Downtime Restart Logic
            # Instead of delete, we use 'start' with '--update-env' which restarts if running
            pm2 start dist/server/entry.mjs --name "$APP_NAME" --update-env || pm2 restart "$APP_NAME"

            # Health Check (Wait for boot)
            sleep 5
            curl -fsS "http://127.0.0.1:$PORT/" || (pm2 logs "$APP_NAME" --lines 50 && exit 1)

      # --- STAGING DEPLOY ---
      - name: Deploy Staging SSR on VPS
        if: github.ref == 'refs/heads/stage' || (github.event_name == 'repository_dispatch' && (github.event.client_payload.target == 'stage' || github.event.client_payload.target == 'staging'))
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR_STAGE }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_STAGE }}"
            export PORT="${{ secrets.VPS_PORT_STAGE || '4322' }}"
            export NODE_OPTIONS="--max-old-space-size=3072"

            cd "$APP_DIR"
            git fetch origin stage
            git reset --hard origin/stage

            corepack enable
            corepack pnpm install --frozen-lockfile
            corepack pnpm run build

            pm2 start dist/server/entry.mjs --name "$APP_NAME" --update-env || pm2 restart "$APP_NAME"

            sleep 5
            curl -fsS "http://127.0.0.1:$PORT/" || (pm2 logs "$APP_NAME" --lines 50 && exit 1)

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deployment to ${{ github.ref_name }}"
