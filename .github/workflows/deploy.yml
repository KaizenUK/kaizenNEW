name: Deploy to cPanel

on:
  push:
    branches:
      - main  # ⚠️ Check against your 'git status' (main vs master)

jobs:
  web-deploy:
    name: 🎉 Deploy
    runs-on: ubuntu-latest
    steps:
      # 1. Get the latest code
      - name: 🚚 Get latest code
        uses: actions/checkout@v4

      # 2. Create the .env file
      - name: 🔑 Make .env file
        run: |
          echo "VITE_SUPABASE_URL=${{ secrets.VITE_SUPABASE_URL }}" >> .env
          echo "VITE_SUPABASE_ANON_KEY=${{ secrets.VITE_SUPABASE_ANON_KEY }}" >> .env

      # 3. Install Node and Build the site
      - name: 🔨 Install & Build
        run: |
          npm install
          npm run build

      # 4. Upload to cPanel via SFTP (The New Method)
      - name: 📂 Sync files via SFTP
        uses: wlixcc/SFTP-Deploy-Action@v1.2.4
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: 22 
          local_path: './dist/*'          # Take everything inside 'dist'
          remote_path: '/public_html/'    # Put it in public_html
          sftp_only: true