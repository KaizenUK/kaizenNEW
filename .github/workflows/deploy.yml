name: Deploy to Kaizen

on:
  push:
    branches:
      - main
      - stage
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy SSR
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy Production SSR on VPS
        if: github.ref == 'refs/heads/main'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            export APP_DIR="${{ secrets.VPS_APP_DIR_PROD }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_PROD }}"
            export PORT="${{ secrets.VPS_PORT_PROD || '4321' }}"
            export HOST="0.0.0.0"
            export VITE_BUILD_NUMBER="${{ github.run_number }}"
            export VITE_BUILD_SHA="${{ github.sha }}"
            export NODE_ENV="production"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing git checkout at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin main --prune
            git checkout main
            git reset --hard origin/main

            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --frozen-lockfile
            pnpm run build

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start dist/server/entry.mjs --name "$APP_NAME"
            fi
            pm2 save

      - name: Deploy Staging SSR on VPS
        if: github.ref == 'refs/heads/stage'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -e
            export APP_DIR="${{ secrets.VPS_APP_DIR_STAGE }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_STAGE }}"
            export PORT="${{ secrets.VPS_PORT_STAGE || '4322' }}"
            export HOST="0.0.0.0"
            export VITE_BUILD_NUMBER="${{ github.run_number }}"
            export VITE_BUILD_SHA="${{ github.sha }}"
            export NODE_ENV="production"

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing git checkout at $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git fetch origin stage --prune
            git checkout stage
            git reset --hard origin/stage

            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --frozen-lockfile
            pnpm run build

            if pm2 describe "$APP_NAME" > /dev/null 2>&1; then
              pm2 restart "$APP_NAME" --update-env
            else
              pm2 start dist/server/entry.mjs --name "$APP_NAME"
            fi
            pm2 save

      # --- DISCORD NOTIFICATION ---
      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deployment to ${{ github.ref_name }}"
          description: "Build #${{ github.run_number }} has finished."
          color: 0x0099ff
