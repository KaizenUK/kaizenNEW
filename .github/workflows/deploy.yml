name: Deploy to Kaizen

on:
  push:
    branches:
      - main
      - stage
  repository_dispatch:
    types:
      - sanity-update
  workflow_dispatch:

jobs:
  web-deploy:
    name: Build and Deploy SSR
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set build metadata
        run: |
          echo "VITE_BUILD_NUMBER=${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Install and Build
        run: |
          pnpm install --frozen-lockfile
          pnpm run build

      - name: Deploy Production SSR on VPS
        if: github.ref == 'refs/heads/main' || github.event_name == 'repository_dispatch'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR_PROD }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_PROD }}"
            export PORT="${{ secrets.VPS_PORT_PROD || '4321' }}"
            export HOST="0.0.0.0"
            export VITE_BUILD_NUMBER="${{ github.run_number }}"
            export VITE_BUILD_SHA="${{ github.sha }}"
            export NODE_ENV="production"
            export CI="true"
            export NODE_OPTIONS="--max-old-space-size=4096"
            export GITHUB_DEPLOY_TOKEN="${{ secrets.GITHUB_DEPLOY_TOKEN }}"
            export GITHUB_DEPLOY_REPO="${{ github.repository }}"
            export GITHUB_DEPLOY_EVENT_TYPE="sanity-update"

            if [ -z "$APP_DIR" ]; then
              echo "Missing required secret: VPS_APP_DIR_PROD"
              exit 1
            fi

            if [ -z "$APP_NAME" ]; then
              echo "Missing required secret: VPS_PM2_APP_PROD"
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "APP_DIR does not exist: $APP_DIR"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing .git directory at APP_DIR: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin main --prune
            git checkout main
            git reset --hard origin/main

            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --frozen-lockfile
            pnpm run build

            START_SCRIPT=""
            for candidate in \
              "dist/server/entry.mjs" \
              "dist/server/node-build.mjs" \
              "dist/server/production.mjs" \
              "dist/server/index.mjs"; do
              if [ -f "$candidate" ]; then
                START_SCRIPT="$candidate"
                break
              fi
            done

            if [ -z "$START_SCRIPT" ]; then
              START_SCRIPT="$(find dist/server -maxdepth 1 -type f -name '*.mjs' | head -n 1 || true)"
            fi

            if [ -z "$START_SCRIPT" ]; then
              echo "Build completed but no runnable server entry was found in dist/server"
              ls -la dist/server || true
              exit 1
            fi

            echo "Using server entry: $START_SCRIPT"
            pm2 delete "$APP_NAME" > /dev/null 2>&1 || true
            pm2 start "$START_SCRIPT" --name "$APP_NAME" --cwd "$APP_DIR" --update-env
            pm2 save

            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "http://127.0.0.1:${PORT}/" > /dev/null; then
                echo "Health check OK on port ${PORT}"
                break
              fi

              if [ "$i" -eq 5 ]; then
                echo "Health check failed on port ${PORT}"
                pm2 logs "$APP_NAME" --lines 80 --nostream || true
                exit 1
              fi

              sleep 2
            done

      - name: Deploy Staging SSR on VPS
        if: github.ref == 'refs/heads/stage'
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          script_stop: true
          script: |
            set -euo pipefail
            export APP_DIR="${{ secrets.VPS_APP_DIR_STAGE }}"
            export APP_NAME="${{ secrets.VPS_PM2_APP_STAGE }}"
            export PORT="${{ secrets.VPS_PORT_STAGE || '4322' }}"
            export HOST="0.0.0.0"
            export VITE_BUILD_NUMBER="${{ github.run_number }}"
            export VITE_BUILD_SHA="${{ github.sha }}"
            export NODE_ENV="production"
            export CI="true"
            export NODE_OPTIONS="--max-old-space-size=4096"

            if [ -z "$APP_DIR" ]; then
              echo "Missing required secret: VPS_APP_DIR_STAGE"
              exit 1
            fi

            if [ -z "$APP_NAME" ]; then
              echo "Missing required secret: VPS_PM2_APP_STAGE"
              exit 1
            fi

            if [ ! -d "$APP_DIR" ]; then
              echo "APP_DIR does not exist: $APP_DIR"
              exit 1
            fi

            if [ ! -d "$APP_DIR/.git" ]; then
              echo "Missing .git directory at APP_DIR: $APP_DIR"
              exit 1
            fi

            cd "$APP_DIR"
            git config --global --add safe.directory "$APP_DIR"
            git fetch origin stage --prune
            git checkout stage
            git reset --hard origin/stage

            corepack enable
            corepack prepare pnpm@10.14.0 --activate
            pnpm install --frozen-lockfile
            pnpm run build

            START_SCRIPT=""
            for candidate in \
              "dist/server/entry.mjs" \
              "dist/server/node-build.mjs" \
              "dist/server/production.mjs" \
              "dist/server/index.mjs"; do
              if [ -f "$candidate" ]; then
                START_SCRIPT="$candidate"
                break
              fi
            done

            if [ -z "$START_SCRIPT" ]; then
              START_SCRIPT="$(find dist/server -maxdepth 1 -type f -name '*.mjs' | head -n 1 || true)"
            fi

            if [ -z "$START_SCRIPT" ]; then
              echo "Build completed but no runnable server entry was found in dist/server"
              ls -la dist/server || true
              exit 1
            fi

            echo "Using server entry: $START_SCRIPT"
            pm2 delete "$APP_NAME" > /dev/null 2>&1 || true
            pm2 start "$START_SCRIPT" --name "$APP_NAME" --cwd "$APP_DIR" --update-env
            pm2 save

            for i in 1 2 3 4 5; do
              if curl -fsS --max-time 10 "http://127.0.0.1:${PORT}/" > /dev/null; then
                echo "Health check OK on port ${PORT}"
                break
              fi

              if [ "$i" -eq 5 ]; then
                echo "Health check failed on port ${PORT}"
                pm2 logs "$APP_NAME" --lines 80 --nostream || true
                exit 1
              fi

              sleep 2
            done

      # --- DISCORD NOTIFICATION ---
      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Deployment to ${{ github.ref_name }}"
          description: "Build #${{ github.run_number }} has finished."
          color: 0x0099ff
