name: Deploy to Kaizen

on:
  push:
    branches:
      - main
      - stage
  repository_dispatch:
    types:
      - sanity-update
  workflow_dispatch:
    inputs:
      preflight_only:
        description: Validate server access and configuration without deploying
        type: boolean
        default: false

concurrency:
  group: kaizen-deploy
  cancel-in-progress: false

jobs:
  static-deploy:
    name: Build and Deploy Static Sites
    runs-on: ubuntu-latest
    env:
      NODE_OPTIONS: --max-old-space-size=6144
      KAIZEN_NODE_BIN: ${{ secrets.VPS_NODE_BIN }}
      PUBLIC_SANITY_PROJECT_ID: ${{ secrets.PUBLIC_SANITY_PROJECT_ID }}
      PUBLIC_SANITY_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
      SANITY_STUDIO_DATASET: ${{ secrets.PUBLIC_SANITY_DATASET }}
      SANITY_API_TOKEN: ${{ secrets.SANITY_API_TOKEN }}
      VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
      VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
    steps:
      - name: Resolve deployment target
        id: target
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
          EVENT_TARGET: ${{ github.event.client_payload.target }}
          REF_NAME: ${{ github.ref_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = repository_dispatch ]; then
            case "$EVENT_TARGET" in
              main|prod|production|'') branch=main ;;
              stage|staging) branch=stage ;;
              *) echo "Unsupported deployment target" >&2; exit 1 ;;
            esac
          else
            case "$REF_NAME" in
              main|stage) branch="$REF_NAME" ;;
              *) echo "Deploy only from main or stage" >&2; exit 1 ;;
            esac
          fi
          echo "branch=$branch" >> "$GITHUB_OUTPUT"

      - name: Checkout selected branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event_name == 'push' && github.sha || steps.target.outputs.branch }}

      - name: Set build metadata
        id: metadata
        shell: bash
        run: |
          echo "sha=$(git rev-parse HEAD)" >> "$GITHUB_OUTPUT"
          echo "VITE_BUILD_NUMBER=$GITHUB_RUN_NUMBER" >> "$GITHUB_ENV"
          echo "VITE_BUILD_SHA=$(git rev-parse HEAD)" >> "$GITHUB_ENV"

      - name: Test deployment preflight
        run: bash tests/deploy/preflight.sh

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Activate production public release
        if: steps.target.outputs.branch == 'main'
        uses: appleboy/ssh-action@v1.2.0
        env:
          VITE_BUILDER_CLOUD: "1"
          BUILDER_RELEASE_ENV_FILE: /etc/kaizen/production.env
          KAIZEN_PREFLIGHT_ONLY: ${{ inputs.preflight_only || false }}
          KAIZEN_APP_DIR: ${{ secrets.VPS_APP_DIR_PROD }}
          KAIZEN_RELEASE_STORE: ${{ secrets.VPS_RELEASES_DIR_PROD }}
          KAIZEN_PUBLIC_DOMAIN: ${{ secrets.VPS_PUBLIC_DOMAIN_PROD || 'kaizenweb.co.uk' }}
          KAIZEN_BUILDER_REQUEST_ID: ${{ github.event.client_payload.releaseId }}
          KAIZEN_DEPLOY_BRANCH: main
          KAIZEN_DEPLOY_SHA: ${{ steps.metadata.outputs.sha }}
          KAIZEN_RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 30m
          envs: KAIZEN_APP_DIR,KAIZEN_RELEASE_STORE,KAIZEN_PUBLIC_DOMAIN,KAIZEN_DEPLOY_BRANCH,KAIZEN_DEPLOY_SHA,KAIZEN_RELEASE_ID,KAIZEN_BUILDER_REQUEST_ID,KAIZEN_NODE_BIN,KAIZEN_PREFLIGHT_ONLY,NODE_OPTIONS,PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET,SANITY_STUDIO_DATASET,SANITY_API_TOKEN,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_BUILD_NUMBER,VITE_BUILD_SHA,VITE_BUILDER_CLOUD,BUILDER_RELEASE_ENV_FILE
          script: |
            set -euo pipefail
            test -n "$KAIZEN_APP_DIR" || { echo "Missing VPS_APP_DIR for the selected target" >&2; exit 1; }
            test -n "$KAIZEN_RELEASE_STORE" || { echo "Missing VPS_RELEASES_DIR for the selected target" >&2; exit 1; }
            export PATH="${KAIZEN_NODE_BIN:+$KAIZEN_NODE_BIN:}$PATH"
            cd "$KAIZEN_APP_DIR"
            git fetch origin main
            git show "$KAIZEN_DEPLOY_SHA:scripts/preflight-public-deploy.sh" | bash
            if [ "$KAIZEN_PREFLIGHT_ONLY" = true ]; then exit 0; fi
            git show "$KAIZEN_DEPLOY_SHA:scripts/deploy-public-release.sh" > "$KAIZEN_RELEASE_STORE/deploy-$KAIZEN_RELEASE_ID.sh"
            bash "$KAIZEN_RELEASE_STORE/deploy-$KAIZEN_RELEASE_ID.sh"

      - name: Activate staging public release
        if: steps.target.outputs.branch == 'stage'
        uses: appleboy/ssh-action@v1.2.0
        env:
          KAIZEN_PREFLIGHT_ONLY: ${{ inputs.preflight_only || false }}
          KAIZEN_APP_DIR: ${{ vars.KAIZEN_STAGE_APP_DIR || '/srv/kaizen/staging' }}
          KAIZEN_RELEASE_STORE: ${{ vars.KAIZEN_STAGE_RELEASE_STORE || '/var/lib/kaizen/staging' }}
          KAIZEN_PUBLIC_DOMAIN: ${{ vars.KAIZEN_STAGE_DOMAIN || 'stage.kaizenweb.co.uk' }}
          KAIZEN_PRODUCTION_APP_DIR: ${{ secrets.VPS_APP_DIR_PROD || '/srv/kaizen/production' }}
          KAIZEN_PRODUCTION_RELEASE_STORE: ${{ secrets.VPS_RELEASES_DIR_PROD || '/var/lib/kaizen/production' }}
          KAIZEN_PRODUCTION_DOMAIN: ${{ secrets.VPS_PUBLIC_DOMAIN_PROD || 'kaizenweb.co.uk' }}
          KAIZEN_BUILDER_REQUEST_ID: ${{ github.event.client_payload.releaseId }}
          KAIZEN_DEPLOY_BRANCH: stage
          KAIZEN_DEPLOY_SHA: ${{ steps.metadata.outputs.sha }}
          KAIZEN_RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 30m
          envs: KAIZEN_APP_DIR,KAIZEN_RELEASE_STORE,KAIZEN_PUBLIC_DOMAIN,KAIZEN_PRODUCTION_APP_DIR,KAIZEN_PRODUCTION_RELEASE_STORE,KAIZEN_PRODUCTION_DOMAIN,KAIZEN_DEPLOY_BRANCH,KAIZEN_DEPLOY_SHA,KAIZEN_RELEASE_ID,KAIZEN_BUILDER_REQUEST_ID,KAIZEN_NODE_BIN,KAIZEN_PREFLIGHT_ONLY,NODE_OPTIONS,PUBLIC_SANITY_PROJECT_ID,PUBLIC_SANITY_DATASET,SANITY_STUDIO_DATASET,SANITY_API_TOKEN,VITE_SUPABASE_URL,VITE_SUPABASE_ANON_KEY,VITE_BUILD_NUMBER,VITE_BUILD_SHA
          script: |
            set -euo pipefail
            test -n "$KAIZEN_APP_DIR" || { echo "Missing VPS_APP_DIR for the selected target" >&2; exit 1; }
            test -n "$KAIZEN_RELEASE_STORE" || { echo "Missing VPS_RELEASES_DIR for the selected target" >&2; exit 1; }
            export PATH="${KAIZEN_NODE_BIN:+$KAIZEN_NODE_BIN:}$PATH"
            cd "$KAIZEN_APP_DIR"
            git fetch origin stage
            git show "$KAIZEN_DEPLOY_SHA:scripts/preflight-public-deploy.sh" | bash
            if [ "$KAIZEN_PREFLIGHT_ONLY" = true ]; then exit 0; fi
            git show "$KAIZEN_DEPLOY_SHA:scripts/deploy-public-release.sh" > "$KAIZEN_RELEASE_STORE/deploy-$KAIZEN_RELEASE_ID.sh"
            bash "$KAIZEN_RELEASE_STORE/deploy-$KAIZEN_RELEASE_ID.sh"

      - name: Copy retained main Studio build to its separate host
        if: steps.target.outputs.branch == 'main' && github.event.client_payload.action != 'rollback' && inputs.preflight_only != true
        uses: appleboy/ssh-action@v1.2.0
        env:
          KAIZEN_RELEASE_STORE: ${{ secrets.VPS_RELEASES_DIR_PROD }}
          KAIZEN_STUDIO_ROOT: ${{ secrets.VPS_STUDIO_WEB_ROOT_PROD }}
          KAIZEN_STUDIO_DOMAIN: ${{ secrets.VPS_STUDIO_DOMAIN_PROD || 'studio.kaizenweb.co.uk' }}
          KAIZEN_RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: KAIZEN_RELEASE_STORE,KAIZEN_STUDIO_ROOT,KAIZEN_STUDIO_DOMAIN,KAIZEN_RELEASE_ID
          script: |
            set -euo pipefail
            if [ -z "$KAIZEN_STUDIO_ROOT" ]; then
              echo "Separate Studio hosting is not configured; the public release includes /studio/."
              exit 0
            fi
            [[ "$KAIZEN_STUDIO_ROOT" == /* ]] || { echo "Studio root must be absolute" >&2; exit 1; }
            studio_root="$(realpath -m "$KAIZEN_STUDIO_ROOT")"
            studio_target="$(realpath -m "$KAIZEN_STUDIO_ROOT/studio")"
            test "$studio_root" != /
            case "$studio_target" in "$studio_root/"*) ;; *) echo "Studio target escapes its configured root" >&2; exit 1 ;; esac
            test -f "$KAIZEN_RELEASE_STORE/releases/$KAIZEN_RELEASE_ID/site/studio/index.html"
            mkdir -p "$studio_target"
            rsync -a --delete "$KAIZEN_RELEASE_STORE/releases/$KAIZEN_RELEASE_ID/site/studio/" "$studio_target/"
            curl -fsS -H "Host: $KAIZEN_STUDIO_DOMAIN" http://127.0.0.1/studio/ >/dev/null

      - name: Copy retained stage Studio build to its separate host
        if: steps.target.outputs.branch == 'stage' && vars.KAIZEN_STAGE_STUDIO_ENABLED == 'true' && github.event.client_payload.action != 'rollback' && inputs.preflight_only != true
        uses: appleboy/ssh-action@v1.2.0
        env:
          KAIZEN_RELEASE_STORE: ${{ vars.KAIZEN_STAGE_RELEASE_STORE || '/var/lib/kaizen/staging' }}
          KAIZEN_STUDIO_ROOT: ${{ secrets.VPS_STUDIO_WEB_ROOT_STAGE }}
          KAIZEN_STUDIO_DOMAIN: ${{ secrets.VPS_STUDIO_DOMAIN_STAGE || 'studio-stage.kaizenweb.co.uk' }}
          KAIZEN_RELEASE_ID: gh-${{ github.run_id }}-${{ github.run_attempt }}
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          port: ${{ secrets.VPS_PORT || '22' }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          envs: KAIZEN_RELEASE_STORE,KAIZEN_STUDIO_ROOT,KAIZEN_STUDIO_DOMAIN,KAIZEN_RELEASE_ID
          script: |
            set -euo pipefail
            if [ -z "$KAIZEN_STUDIO_ROOT" ]; then
              echo "Separate Studio hosting is not configured; the public release includes /studio/."
              exit 0
            fi
            [[ "$KAIZEN_STUDIO_ROOT" == /* ]] || { echo "Studio root must be absolute" >&2; exit 1; }
            studio_root="$(realpath -m "$KAIZEN_STUDIO_ROOT")"
            studio_target="$(realpath -m "$KAIZEN_STUDIO_ROOT/studio")"
            test "$studio_root" != /
            case "$studio_target" in "$studio_root/"*) ;; *) echo "Studio target escapes its configured root" >&2; exit 1 ;; esac
            test -f "$KAIZEN_RELEASE_STORE/releases/$KAIZEN_RELEASE_ID/site/studio/index.html"
            mkdir -p "$studio_target"
            rsync -a --delete "$KAIZEN_RELEASE_STORE/releases/$KAIZEN_RELEASE_ID/site/studio/" "$studio_target/"
            curl -fsS -H "Host: $KAIZEN_STUDIO_DOMAIN" http://127.0.0.1/studio/ >/dev/null

      - name: Discord Notification
        if: always()
        uses: sarisia/actions-status-discord@v1
        with:
          webhook: ${{ secrets.DISCORD_WEBHOOK }}
          status: ${{ job.status }}
          title: "Static deploy to ${{ github.ref_name }}"
