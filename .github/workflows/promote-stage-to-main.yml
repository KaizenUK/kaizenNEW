name: Promote Stage to Main

on:
  workflow_dispatch:
    inputs:
      deploy_main_after_merge:
        description: "Trigger main deploy workflow after merge"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: Merge stage into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge stage into main and push
        run: |
          git fetch origin main stage
          git checkout main
          git merge --no-ff origin/stage -m "chore: promote stage to main"
          git push origin main

      - name: Trigger deploy workflow for main
        if: ${{ inputs.deploy_main_after_merge }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              ref: "main",
            });
