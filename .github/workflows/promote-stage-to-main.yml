name: Promote Stage to Main

on:
  workflow_dispatch:
    inputs:
      deploy_main_after_merge:
        description: "Trigger main deploy workflow after merge"
        required: false
        default: true
        type: boolean

permissions:
  contents: write
  actions: write

jobs:
  promote:
    name: Merge stage into main
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git identity
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Merge stage into main and push
        run: |
          set -euo pipefail
          git fetch origin main stage
          git checkout main
          git reset --hard origin/main

          resolve_with_stage() {
            local file="$1"
            # Stage 3 exists when "theirs" has file content.
            if git cat-file -e ":3:${file}" 2>/dev/null; then
              git checkout --theirs -- "${file}"
              git add "${file}"
              return
            fi

            # If stage deleted the file, preserve that deletion.
            if git ls-files --error-unmatch -- "${file}" >/dev/null 2>&1; then
              git rm -f -- "${file}"
            else
              git rm -f --cached -- "${file}" >/dev/null 2>&1 || true
              rm -f -- "${file}" || true
            fi
          }

          MERGE_MESSAGE="chore: promote stage to main"
          if git merge --no-ff --no-commit origin/stage; then
            echo "Merge applied cleanly."
          else
            echo "Merge produced conflicts. Trying approved auto-resolution..."
            CONFLICTS="$(git diff --name-only --diff-filter=U || true)"

            if [ -z "${CONFLICTS}" ]; then
              echo "Merge failed without conflict markers."
              exit 1
            fi

            echo "Conflicted files:"
            echo "${CONFLICTS}"

            while IFS= read -r file; do
              [ -z "${file}" ] && continue
              case "${file}" in
                package.json|pnpm-lock.yaml|package-lock.json|server/node-build.ts|vite.config.server.ts|.github/workflows/promote-stage-to-main.yml)
                  echo "Resolving ${file} with stage branch version."
                  resolve_with_stage "${file}"
                  ;;
                *)
                  echo "Unsupported conflict file: ${file}"
                  echo "Resolve this conflict manually, then rerun the workflow."
                  git merge --abort || true
                  exit 1
                  ;;
              esac
            done <<< "${CONFLICTS}"

            if git diff --name-only --diff-filter=U | grep -q .; then
              echo "Unresolved conflicts remain:"
              git diff --name-only --diff-filter=U
              git merge --abort || true
              exit 1
            fi
          fi

          if git diff --cached --quiet; then
            echo "No merge commit needed. main is already up to date with stage."
          else
            git commit -m "${MERGE_MESSAGE}"
            git push origin main
          fi

      - name: Trigger deploy workflow for main
        if: ${{ inputs.deploy_main_after_merge }}
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.actions.createWorkflowDispatch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              workflow_id: "deploy.yml",
              ref: "main",
            });
