      - "client/lib/supabase*.ts"
      - "client/lib/authRedirect.ts"
      - "shared/builderAccount.ts"
      - "shared/builderLegal.ts"
      - "shared/builderPrivacy.ts"
      - "shared/visualBuilder.ts"
      - "shared/builderSite.ts"
      - "shared/builderContact.ts"
      - "shared/builderContent.ts"
      - "shared/builderLibrary.ts"
      - "shared/builderBackup.ts"
      - "shared/builderImages.ts"
      - "shared/builderRegistry.ts"
      - "shared/builderConversions.ts"
      - "shared/builderReleases.ts"
      - "shared/builderPreviews.ts"
      - "shared/builderRoutes.ts"
      - "shared/builderPageInventory.ts"
      - "shared/builderRouteTypes.ts"
      - "shared/builderRedirects.js"
      - "shared/builderProjects.ts"
      - "shared/builderOrigins.ts"
      - "shared/builderDiagnostics.ts"
      - "shared/builderSettings.ts"
      - "shared/builderClientPublication.ts"
      - "shared/builderSiteMetadata.ts"
      - "shared/builderWebsiteStatus.ts"
      - "shared/builderProjectOperations.ts"
      - "shared/builderStarter.ts"
      - "shared/builderRepositorySave.ts"
      - "shared/builderRepositorySettings.ts"
      - "shared/builderRepositoryPublish.ts"
      - "shared/publicRoutePolicy.js"
      - "shared/nginxRedirects.js"
      - "supabase/migrations/*builder*"
      - "supabase/functions/builder-publish/**"
      - "supabase/functions/builder-contact/**"
