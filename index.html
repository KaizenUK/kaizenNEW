<!doctype html>
<html lang="en-GB">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Web Design Wirral | Fast, Custom Sites from £2k | Kaizen</title>
    <meta
      name="description"
      content="We build fast websites for Wirral businesses. £2k-£15k, 2-4 week turnaround. No WordPress bloat. Just speed and leads."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Kaizen Web" />
    <meta name="publisher" content="Kaizen Web" />
    <meta name="theme-color" content="#040D21" />
    <!-- Preconnect to critical resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.builder.io" crossorigin />
    <!-- Load fonts with display=swap for better CLS -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <!-- Preload critical hero assets -->
    <link
      rel="preload"
      as="image"
      href="/logo.svg"
      fetchpriority="high"
      crossorigin="anonymous"
    />
    <style>
      :root {
        --kaizen-cyan: 6 182 212;
        --kaizen-lime: 132 204 22;
        --critical-bg: hsl(210 14% 97%);
        --critical-fg: hsl(222 47% 11%);
      }
      *,
      *::before,
      *::after {
        box-sizing: border-box;
      }
      html,
      body,
      #root {
        min-height: 100%;
      }
      body {
        margin: 0;
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        background: var(--critical-bg);
        color: var(--critical-fg);
      }
      .site-shell {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        background: var(--critical-bg);
        color: var(--critical-fg);
      }
      .site-shell main {
        flex: 1;
      }
      .site-header {
        position: sticky;
        top: 0;
        z-index: 50;
        width: 100%;
        background: #ffffff;
        border-bottom: 1px solid #f3f4f6;
      }
      .site-header-wrap {
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1rem;
      }
      .site-header-inner {
        display: flex;
        align-items: center;
        height: 4rem;
      }
      .site-header-nav {
        display: none;
      }
      .site-header-speed,
      .site-header-cta {
        display: none;
      }
      .site-header-mobile {
        display: inline-flex;
        align-items: center;
        justify-content: center;
      }
      .home-hero {
        position: relative;
        isolation: isolate;
        min-height: 100vh;
        display: flex;
        align-items: center;
        padding: 5rem 0;
        overflow: hidden;
        color: #ffffff;
        background: #020617;
      }
      .home-hero-lcp-preload {
        position: absolute;
        inset: 0;
        width: 0;
        height: 0;
        opacity: 0;
        pointer-events: none;
      }
      .home-hero-container {
        width: 100%;
        max-width: 80rem;
        margin: 0 auto;
        padding: 0 1rem;
        position: relative;
        z-index: 1;
      }
      .home-hero-grid {
        max-width: 80rem;
        margin: 0 auto;
        display: grid;
        grid-template-columns: 1fr;
        gap: 3rem;
        align-items: center;
      }
      .home-hero-copy {
        max-width: 42rem;
      }
      .home-hero-kicker {
        margin: 0 0 1.5rem;
        font-size: 0.75rem;
        letter-spacing: 0.25em;
        text-transform: uppercase;
        color: rgb(var(--kaizen-cyan));
      }
      .home-hero-title {
        margin: 0 0 2rem;
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-weight: 900;
        font-size: clamp(2.25rem, 6vw, 4.5rem);
        line-height: 1.05;
        color: #ffffff;
      }
      .home-hero-desc {
        margin: 0 0 2.5rem;
        max-width: 40rem;
        font-size: clamp(1rem, 2.2vw, 1.25rem);
        line-height: 1.6;
        color: rgba(255, 255, 255, 0.85);
      }
      .home-hero-actions {
        margin: 0 0 2rem;
        display: flex;
        flex-direction: column;
        align-items: flex-start;
        gap: 1rem;
      }
      .home-hero-btn-primary,
      .home-hero-btn-secondary {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 0.5rem;
        border-radius: 0.5rem;
        padding: 1rem 2rem;
        font-family: "Space Grotesk", Inter, system-ui, sans-serif;
        font-size: 1.125rem;
        font-weight: 700;
      }
      .home-hero-btn-primary {
        border: 2px solid transparent;
        background: #ffffff;
        color: #000000;
      }
      .home-hero-btn-secondary {
        border: 2px solid rgba(255, 255, 255, 0.3);
        background: transparent;
        color: #ffffff;
      }
      .home-hero-gauge {
        display: none;
      }
      .home-hero-grid-overlay {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        opacity: 0.2;
        z-index: -10;
      }
      .home-hero-spotlight {
        position: absolute;
        z-index: -10;
        opacity: 0.6;
      }
      .home-hero-bottom-fade {
        position: absolute;
        inset-inline: 0;
        bottom: 0;
        height: 33.333%;
        z-index: -10;
        pointer-events: none;
        background: linear-gradient(to top, #020617, transparent);
      }
      .hero-mesh-bg {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        background: #020617;
        pointer-events: none;
      }
      .hero-mesh-blob {
        position: absolute;
        border-radius: 9999px;
        filter: blur(56px);
        opacity: 0.9;
      }
      .hero-mesh-blob--violet {
        width: 600px;
        height: 600px;
        top: -200px;
        left: -200px;
        background: radial-gradient(
          circle at 30% 30%,
          rgba(124, 58, 237, 0.6),
          rgba(124, 58, 237, 0) 70%
        );
      }
      .hero-mesh-blob--teal {
        width: 550px;
        height: 550px;
        top: 50%;
        right: -150px;
        background: radial-gradient(
          circle at 60% 40%,
          rgba(15, 118, 110, 0.5),
          rgba(15, 118, 110, 0) 70%
        );
      }
      .hero-mesh-blob--gold {
        width: 500px;
        height: 500px;
        bottom: -150px;
        left: 30%;
        background: radial-gradient(
          circle at 40% 70%,
          rgba(245, 158, 11, 0.4),
          rgba(245, 158, 11, 0) 70%
        );
      }
      .hero-spotlight {
        position: absolute;
        pointer-events: none;
        width: 38rem;
        aspect-ratio: 1 / 1;
        left: 50%;
        top: 50%;
        background: radial-gradient(
          circle,
          rgba(6, 182, 212, 0.15) 0%,
          rgba(124, 58, 237, 0.08) 50%,
          transparent 100%
        );
        transform: translate3d(-50%, -50%, 0);
      }
      @media (min-width: 640px) {
        .site-header-wrap {
          padding: 0 1.5rem;
        }
        .home-hero-actions {
          flex-direction: row;
        }
        .site-header-cta {
          display: inline-flex;
        }
      }
      @media (min-width: 768px) {
        .site-header-speed {
          display: inline-flex;
        }
      }
      @media (min-width: 1024px) {
        .site-header-wrap {
          padding: 0 2rem;
        }
        .site-header-nav {
          display: flex;
          align-items: center;
          flex: 1;
        }
        .site-header-mobile {
          display: none;
        }
        .home-hero-grid {
          grid-template-columns: minmax(0, 1fr) minmax(280px, 420px);
          gap: 4rem;
        }
        .home-hero-gauge {
          display: block;
        }
      }
    </style>
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/x-icon" href="/favicon.ico" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
