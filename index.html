<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Kaizen Web | Wirral Web Design & Local SEO Agency</title>
    <meta
      name="description"
      content="High-performance web design for Wirral businesses. Fast, conversion-led websites plus technical consulting for software projects that need rescuing."
    />
    <meta name="robots" content="index, follow" />
    <meta name="author" content="Kaizen Web" />
    <meta name="publisher" content="Kaizen Web" />
    <meta name="theme-color" content="#040D21" />
    <!-- Preconnect to critical resources for faster loading -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link rel="preconnect" href="https://cdn.builder.io" crossorigin />
    <!-- Load fonts with display=swap for better CLS -->
    <link
      rel="preload"
      as="style"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
    />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      media="print"
      onload="this.media='all'"
    />
    <noscript>
      <link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&display=swap"
      />
    </noscript>
    <!-- DNS prefetch for external resources -->
    <link rel="dns-prefetch" href="https://www.googleapis.com" />
    <link rel="dns-prefetch" href="https://client.crisp.chat" />
    <link rel="dns-prefetch" href="https://www.googletagmanager.com" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png" />
    <link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png" />
    <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48x48.png" />
    <link
      rel="icon"
      type="image/png"
      sizes="192x192"
      href="/android-chrome-192x192.png"
    />
    <link
      rel="icon"
      type="image/png"
      sizes="512x512"
      href="/android-chrome-512x512.png"
    />
    <script type="text/javascript">
      window.$crisp = [];
      window.CRISP_WEBSITE_ID = "9d827b35-3e4e-494f-8c0b-72d233fc92bb";
      // Defer Crisp Chat loading by 4 seconds to avoid blocking main thread
      // This improves TBT (Total Blocking Time) and First Contentful Paint
      window.addEventListener("load", function () {
        setTimeout(function () {
          var d = document;
          var s = d.createElement("script");
          s.src = "https://client.crisp.chat/l.js";
          s.async = 1;
          d.getElementsByTagName("head")[0].appendChild(s);
        }, 4000);
      });
    </script>
  </head>

  <body>
    <div id="root"></div>

    <script type="module" src="/client/main.tsx"></script>
  </body>
</html>
